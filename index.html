<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; frame-src 'self'; img-src data:; base-uri 'none'; form-action 'none'">
<meta name="description" content="Math Museum: find the mistake in each worked math problem. Free, with no ads, accounts, or tracking.">
<title>Math Museum</title>
<style>
  :root { --ink: #14202B; --muted: #44505C; --paper: #FFFFFF; --line: #8C99A6; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; background: #FFFFFF; color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 1.1rem; line-height: 1.4;
  }
  [hidden] { display: none !important; }
  a, button { font: inherit; }
  a:focus-visible, button:focus-visible { outline: 4px solid var(--ink); outline-offset: 3px; box-shadow: 0 0 0 7px #FFFFFF; }
  .skip { position: absolute; left: 0.5rem; top: -4rem; background: var(--paper); color: #1B63D6; padding: 0.5rem 1rem; border: 3px solid #1B63D6; z-index: 50; }
  .skip:focus { top: 0.5rem; }
  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; padding: 0.4rem 0.75rem; background: var(--paper);
    border-bottom: 6px solid; border-image: linear-gradient(90deg, #FF4D4D, #FF9F1C, #FFD43B, #4CD964, #3AA0FF, #8A5CF6) 1; }
  .brand { font-weight: 800; font-size: 1.3rem; margin: 0; }
  .spacer { flex: 1 1 auto; }
  .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 2.8rem; padding: 0.2rem 1rem; font-weight: 700;
    color: var(--ink); background: #FFF3C4; border: 2px solid var(--ink); border-radius: 0.5rem; cursor: pointer; text-decoration: none; }
  main { flex: 1 1 auto; position: relative; min-height: 70vh; }
  #frame { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #FFFFFF; }
  .help { margin: 0; padding: 0.3rem 0.75rem; font-size: 0.95rem; color: var(--muted); border-top: 1px solid var(--line); }
</style>
</head>
<body>
<a class="skip" href="#main">Skip to the game</a>
<header class="bar">
  <h1 class="brand">Math Museum</h1>
  <span class="spacer"></span>
  <button type="button" class="btn" id="btnFull" hidden>Full screen</button>
  <a class="btn" href="math-museum.html" target="_blank" rel="noopener">Open in new tab</a>
</header>
<main id="main">
  <iframe id="frame" title="Math Museum" src="math-museum.html" allow="fullscreen" referrerpolicy="no-referrer"
          sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>
</main>
<p class="help">If the game does not appear, use &ldquo;Open in new tab.&rdquo;</p>
<noscript><p style="padding:1rem">JavaScript is turned off. <a href="math-museum.html">Open Math Museum</a>.</p></noscript>
<script>
(function () {
  'use strict';
  var frame = document.getElementById('frame'), btn = document.getElementById('btnFull');
  if (frame.requestFullscreen) { btn.hidden = false; }
  btn.addEventListener('click', function () {
    if (document.fullscreenElement) { document.exitFullscreen(); }
    else if (frame.requestFullscreen) { frame.requestFullscreen(); }
  });
})();
</script>
</body>
</html>
